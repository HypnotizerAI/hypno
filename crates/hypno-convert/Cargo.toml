[package]
name = "hypno-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Convert HuggingFace safetensors, GGUF, and LoRA adapters to .hypno format"

[lib]
name = "hypno_convert"
path = "src/lib.rs"

[[bin]]
name = "hypno-convert"
path = "src/main.rs"

[dependencies]
hypno-core = { version = "0.1.0", path = "../hypno-core" }
hypno-quantize = { version = "0.1.0", path = "../hypno-quantize" }
hypno-loader = { version = "0.1.0", path = "../hypno-loader" }
safetensors = "0.5"
half.workspace = true
bytemuck.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
memmap2.workspace = true
rayon.workspace = true
env_logger.workspace = true
tempfile = "3"

[dev-dependencies]
