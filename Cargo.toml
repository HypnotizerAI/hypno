[workspace]
resolver = "2"
members = [
    "crates/hypno-core",
    "crates/hypno-convert",
    "crates/hypno-loader",
    "crates/hypno-inference",
    "crates/hypno-quantize",
    "crates/hypno-tokenizer",
    "crates/hypno-cli",
    "crates/hypno-bench",
    "crates/hypno-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
license-file = "LICENSE-APACHE"
repository = "https://github.com/HypnotizerAI/hypno"
authors = ["Hot-Coco <207921092+Hot-Coco@users.noreply.github.com>"]
keywords = ["llm", "inference", "transformer", "simd", "machine-learning"]
categories = ["science", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
half = { version = "2", features = ["bytemuck"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
