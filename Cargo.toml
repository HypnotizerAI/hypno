[workspace]
resolver = "2"
members = [
    "crates/hypntz-core",
    "crates/hypntz-convert",
    "crates/hypntz-loader",
    "crates/hypntz-inference",
    "crates/hypntz-quantize",
    "crates/hypntz-tokenizer",
    "crates/hypntz-cli",
    "crates/hypntz-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
half = { version = "2", features = ["bytemuck"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
