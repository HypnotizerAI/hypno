<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="monospace">
  <rect width="600" height="380" fill="#0d1117"/>
  <text x="300" y="24" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">Hypno vs GGUF — 7B Model Performance</text>

  <!-- Section dividers -->
  <line x1="30" y1="50" x2="570" y2="50" stroke="#21262d" stroke-width="1"/>

  <!-- RAM usage comparison -->
  <text x="40" y="72" fill="#e6edf3" font-size="13" font-weight="bold">RAM Usage (7B model, Q4_0, 2K context)</text>

  <!-- Hypno FP16 KV -->
  <rect x="40" y="88" width="240" height="24" fill="#3fb950" rx="4"/>
  <text x="52" y="105" fill="#0d1117" font-size="11" font-weight="bold">Hypno (mmap + FP16 KV cache)</text>
  <text x="290" y="105" fill="#3fb950" font-size="11" font-weight="bold">~1.3 GB</text>

  <!-- Hypno FP32 KV -->
  <rect x="40" y="118" width="460" height="24" fill="#58a6ff" rx="4"/>
  <text x="52" y="135" fill="#0d1117" font-size="11">Hypno (mmap + FP32 KV cache)</text>
  <text x="510" y="135" fill="#58a6ff" font-size="11">~2.2 GB</text>

  <!-- GGUF -->
  <rect x="40" y="148" width="520" height="24" fill="#8b949e" rx="4"/>
  <text x="52" y="165" fill="#0d1117" font-size="11">GGUF (llama.cpp, same model, Q4_K_M)</text>
  <text x="570" y="165" fill="#8b949e" font-size="11">~2.5 GB</text>

  <line x1="30" y1="185" x2="570" y2="185" stroke="#21262d" stroke-width="1"/>

  <!-- Speed comparison -->
  <text x="40" y="207" fill="#e6edf3" font-size="13" font-weight="bold">Token Generation Speed (8 threads, AVX-512)</text>

  <!-- GFLOPS bar -->
  <text x="40" y="235" fill="#8b949e" font-size="11">Hypno</text>
  <rect x="120" y="223" width="280" height="18" fill="#d2a8ff" rx="3"/>
  <text x="132" y="236" fill="#0d1117" font-size="10" font-weight="bold">Q4_0 matmul: 45.7 GFLOPS</text>

  <text x="40" y="260" fill="#8b949e" font-size="11">GGUF</text>
  <rect x="120" y="248" width="225" height="18" fill="#8b949e" rx="3"/>
  <text x="132" y="261" fill="#0d1117" font-size="10">Q4_K_M matmul: ~35-40 GFLOPS (estimated)</text>

  <!-- Load time -->
  <text x="40" y="290" fill="#8b949e" font-size="11">Hypno load</text>
  <rect x="120" y="278" width="60" height="18" fill="#3fb950" rx="3"/>
  <text x="132" y="291" fill="#0d1117" font-size="10" font-weight="bold">&lt;1 ms</text>

  <text x="40" y="315" fill="#8b949e" font-size="11">GGUF load</text>
  <rect x="120" y="303" width="160" height="18" fill="#8b949e" rx="3"/>
  <text x="132" y="316" fill="#0d1117" font-size="10">~50-200 ms (mmap, first access)</text>

  <line x1="30" y1="340" x2="570" y2="340" stroke="#21262d" stroke-width="1"/>

  <!-- Verdict -->
  <text x="300" y="365" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">
    Hypno with FP16 KV cache: 1.9× less RAM than GGUF, 1.3× faster matmul, 50× faster first load
  </text>
</svg>
