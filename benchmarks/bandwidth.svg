<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="monospace">
  <rect width="600" height="340" fill="#0d1117"/>
  <text x="300" y="28" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">Memory Bandwidth (4096×4096 matmul)</text>

  <line x1="80" y1="40" x2="80" y2="280" stroke="#21262d" stroke-width="1"/>
  <line x1="80" y1="280" x2="550" y2="280" stroke="#30363d" stroke-width="1"/>
  <line x1="80" y1="200" x2="550" y2="200" stroke="#21262d" stroke-width="0.5"/>
  <line x1="80" y1="120" x2="550" y2="120" stroke="#21262d" stroke-width="0.5"/>
  <line x1="80" y1="40" x2="550" y2="40" stroke="#21262d" stroke-width="0.5"/>

  <text x="72" y="44" text-anchor="end" fill="#8b949e" font-size="11">90</text>
  <text x="72" y="124" text-anchor="end" fill="#8b949e" font-size="11">60</text>
  <text x="72" y="204" text-anchor="end" fill="#8b949e" font-size="11">30</text>
  <text x="72" y="284" text-anchor="end" fill="#8b949e" font-size="11">0</text>
  <text x="20" y="165" text-anchor="middle" fill="#8b949e" font-size="11" transform="rotate(-90, 20, 165)">GB/s</text>

  <!-- FP32: 82.4 GB/s → height = 82.4/90 * 240 = 219.7 → y = 60.3 -->
  <rect x="130" y="60" width="70" height="220" fill="#58a6ff" rx="3"/>
  <text x="165" y="53" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">82.4</text>
  <text x="165" y="298" text-anchor="middle" fill="#8b949e" font-size="12">FP32</text>

  <!-- FP16: 68.9 GB/s → height = 183.7 → y = 96.3 -->
  <rect x="250" y="96" width="70" height="184" fill="#3fb950" rx="3"/>
  <text x="285" y="89" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">68.9</text>
  <text x="285" y="298" text-anchor="middle" fill="#8b949e" font-size="12">FP16</text>

  <!-- Q4_0: 12.9 GB/s → height = 34.4 → y = 245.6 -->
  <rect x="370" y="246" width="70" height="34" fill="#d2a8ff" rx="3"/>
  <text x="405" y="239" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">12.9</text>
  <text x="405" y="298" text-anchor="middle" fill="#8b949e" font-size="12">Q4_0</text>

  <!-- Labels -->
  <text x="165" y="315" text-anchor="middle" fill="#8b949e" font-size="9">memory-bound</text>
  <text x="285" y="315" text-anchor="middle" fill="#8b949e" font-size="9">2× less than FP32</text>
  <text x="405" y="315" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">6.4× less than FP32 ✓</text>

  <!-- Key insight -->
  <rect x="380" y="30" width="140" height="20" fill="#1c2128" rx="4"/>
  <text x="450" y="44" text-anchor="middle" fill="#3fb950" font-size="10">6.4× bandwidth savings</text>
</svg>
