<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="monospace">
  <rect width="600" height="340" fill="#0d1117"/>
  <text x="300" y="28" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">MatMul GFLOPS by Dtype (4096×4096, 8 threads)</text>

  <!-- Grid lines -->
  <line x1="80" y1="40" x2="80" y2="280" stroke="#21262d" stroke-width="1"/>
  <line x1="80" y1="280" x2="550" y2="280" stroke="#30363d" stroke-width="1"/>
  <line x1="80" y1="220" x2="550" y2="220" stroke="#21262d" stroke-width="0.5"/>
  <line x1="80" y1="160" x2="550" y2="160" stroke="#21262d" stroke-width="0.5"/>
  <line x1="80" y1="100" x2="550" y2="100" stroke="#21262d" stroke-width="0.5"/>
  <line x1="80" y1="40" x2="550" y2="40" stroke="#21262d" stroke-width="0.5"/>

  <!-- Y axis labels -->
  <text x="72" y="44" text-anchor="end" fill="#8b949e" font-size="11">80</text>
  <text x="72" y="104" text-anchor="end" fill="#8b949e" font-size="11">60</text>
  <text x="72" y="164" text-anchor="end" fill="#8b949e" font-size="11">40</text>
  <text x="72" y="224" text-anchor="end" fill="#8b949e" font-size="11">20</text>
  <text x="72" y="284" text-anchor="end" fill="#8b949e" font-size="11">0</text>
  <text x="20" y="165" text-anchor="middle" fill="#8b949e" font-size="11" transform="rotate(-90, 20, 165)">GFLOPS</text>

  <!-- FP32 bar: 41.2 GFLOPS → height = 41.2/80 * 240 = 123.6 → y = 280-123.6 = 156.4 -->
  <rect x="130" y="156" width="60" height="124" fill="#58a6ff" rx="3"/>
  <text x="160" y="149" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">41.2</text>
  <text x="160" y="298" text-anchor="middle" fill="#8b949e" font-size="12">FP32</text>

  <!-- FP16 bar: 68.8 GFLOPS → height = 68.8/80 * 240 = 206.4 → y = 280-206.4 = 73.6 -->
  <rect x="240" y="74" width="60" height="206" fill="#3fb950" rx="3"/>
  <text x="270" y="67" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">68.8</text>
  <text x="270" y="298" text-anchor="middle" fill="#8b949e" font-size="12">FP16</text>

  <!-- Q4_0 bar: 45.7 GFLOPS → height = 45.7/80 * 240 = 137.1 → y = 280-137.1 = 142.9 -->
  <rect x="350" y="143" width="60" height="137" fill="#d2a8ff" rx="3"/>
  <text x="380" y="136" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">45.7</text>
  <text x="380" y="298" text-anchor="middle" fill="#8b949e" font-size="12">Q4_0</text>

  <!-- Scalar FP32 bar: ~3.3 GFLOPS → height = 3.3/80 * 240 = 9.9 → y = 280-9.9 = 270.1 -->
  <rect x="460" y="270" width="60" height="10" fill="#484f58" rx="3"/>
  <text x="490" y="265" text-anchor="middle" fill="#8b949e" font-size="13">3.3</text>
  <text x="490" y="298" text-anchor="middle" fill="#8b949e" font-size="12">Scalar</text>

  <!-- Legend -->
  <rect x="130" y="318" width="10" height="10" fill="#58a6ff" rx="2"/>
  <text x="145" y="327" fill="#8b949e" font-size="10">FP32</text>
  <rect x="200" y="318" width="10" height="10" fill="#3fb950" rx="2"/>
  <text x="215" y="327" fill="#8b949e" font-size="10">FP16</text>
  <rect x="270" y="318" width="10" height="10" fill="#d2a8ff" rx="2"/>
  <text x="285" y="327" fill="#8b949e" font-size="10">Q4_0 (7.1× smaller)</text>
  <rect x="390" y="318" width="10" height="10" fill="#484f58" rx="2"/>
  <text x="405" y="327" fill="#8b949e" font-size="10">Scalar baseline</text>
</svg>
