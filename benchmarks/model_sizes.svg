<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="monospace">
  <rect width="600" height="340" fill="#0d1117"/>
  <text x="300" y="24" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">What fits in 2 GB RAM with Hypno</text>

  <!-- Model sizes at Q4_0 on disk + FP16 KV cache RAM -->
  <line x1="60" y1="50" x2="60" y2="300" stroke="#21262d" stroke-width="1"/>
  <line x1="60" y1="300" x2="560" y2="300" stroke="#30363d" stroke-width="1"/>

  <!-- Y labels -->
  <text x="52" y="54" text-anchor="end" fill="#8b949e" font-size="10">8 GB</text>
  <text x="52" y="114" text-anchor="end" fill="#8b949e" font-size="10">6 GB</text>
  <text x="52" y="174" text-anchor="end" fill="#8b949e" font-size="10">4 GB</text>
  <text x="52" y="234" text-anchor="end" fill="#8b949e" font-size="10">2 GB</text>
  <text x="52" y="294" text-anchor="end" fill="#8b949e" font-size="10">0</text>

  <!-- 2 GB line -->
  <line x1="60" y1="234" x2="560" y2="234" stroke="#f85149" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="565" y="236" fill="#f85149" font-size="9">2 GB limit</text>

  <!-- 3B: 1.7 GB disk, 2.0 GB RAM → y=234 -->
  <rect x="100" y="234" width="55" height="66" fill="#3fb950" rx="3"/>
  <text x="127" y="228" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="bold">✓</text>
  <text x="127" y="315" text-anchor="middle" fill="#8b949e" font-size="10">3B</text>

  <!-- 7B: 4 GB disk, 2.5 GB RAM (±) → y=206 -->
  <rect x="210" y="206" width="55" height="94" fill="#d29922" rx="3"/>
  <text x="237" y="200" text-anchor="middle" fill="#e6edf3" font-size="10">±</text>
  <text x="237" y="315" text-anchor="middle" fill="#8b949e" font-size="10">7B</text>

  <!-- 8B: 4.5 GB disk, 3 GB RAM → y=188 -->
  <rect x="320" y="188" width="55" height="112" fill="#f85149" rx="3"/>
  <text x="347" y="182" text-anchor="middle" fill="#e6edf3" font-size="10">✗</text>
  <text x="347" y="315" text-anchor="middle" fill="#8b949e" font-size="10">8B</text>

  <!-- 13B: 7.3 GB disk, too big → y=81 -->
  <rect x="430" y="81" width="55" height="219" fill="#484f58" rx="3"/>
  <text x="457" y="75" text-anchor="middle" fill="#e6edf3" font-size="10">✗</text>
  <text x="457" y="315" text-anchor="middle" fill="#8b949e" font-size="10">13B</text>

  <!-- Tok/sec estimates -->
  <text x="127" y="330" text-anchor="middle" fill="#3fb950" font-size="9">30-50 tok/s</text>
  <text x="237" y="330" text-anchor="middle" fill="#d29922" font-size="9">15-25 tok/s</text>

  <!-- Insight box -->
  <rect x="100" y="52" width="430" height="25" fill="#1c2128" rx="4"/>
  <text x="315" y="69" text-anchor="middle" fill="#3fb950" font-size="11">
    3B-7B Q4_0 + FP16 KV cache: 30+ tok/s on 2 GB RAM ✅
  </text>
</svg>
