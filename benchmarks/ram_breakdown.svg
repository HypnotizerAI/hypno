<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="monospace">
  <rect width="600" height="320" fill="#0d1117"/>
  <text x="300" y="24" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">RAM Breakdown — 7B Model @ Q4_0 (2K context)</text>

  <!-- Two columns: FP32 KV cache vs FP16 KV cache -->
  <text x="180" y="55" text-anchor="middle" fill="#8b949e" font-size="12">FP32 KV cache</text>
  <text x="420" y="55" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">FP16 KV cache</text>

  <line x1="300" y1="60" x2="300" y2="300" stroke="#30363d" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- FP32 column: Total ~2.2 GB → 220 units, scale: 1 unit = 10 MB -->
  <!-- Active weights: 270 MB → 27 units -->
  <rect x="80" y="105" width="180" height="27" fill="#d2a8ff" rx="3"/>
  <text x="90" y="118" fill="#0d1117" font-size="9">Active weights (Q4_0) — 270 MB</text>

  <!-- KV cache: ~1.9 GB → 190 units -->
  <rect x="80" y="140" width="180" height="155" fill="#f85149" rx="3"/>
  <text x="90" y="160" fill="#0d1117" font-size="9" font-weight="bold">KV cache (FP32) — 1.9 GB</text>

  <!-- Scratch: ~30 MB → 3 units -->
  <rect x="80" y="303" width="180" height="3" fill="#484f58" rx="1"/>
  <text x="90" y="312" fill="#8b949e" font-size="9">Scratch — 30 MB</text>

  <!-- FP16 column: Total ~1.0 GB → 100 units -->
  <!-- Active weights: same 270 MB → 27 units -->
  <rect x="320" y="105" width="180" height="27" fill="#d2a8ff" rx="3"/>
  <text x="330" y="118" fill="#0d1117" font-size="9">Active weights (Q4_0) — 270 MB</text>

  <!-- KV cache: ~700 MB → 70 units -->
  <rect x="320" y="225" width="180" height="78" fill="#3fb950" rx="3"/>
  <text x="330" y="245" fill="#0d1117" font-size="9" font-weight="bold">KV cache (FP16)</text>
  <text x="330" y="258" fill="#0d1117" font-size="9">— 700 MB</text>

  <!-- Scratch: same -->
  <rect x="320" y="303" width="180" height="3" fill="#484f58" rx="1"/>
  <text x="330" y="312" fill="#8b949e" font-size="9">Scratch — 30 MB</text>

  <!-- Total labels -->
  <text x="170" y="80" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">Total: ~2.2 GB</text>
  <text x="410" y="80" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Total: ~1.0 GB</text>

  <!-- RAM savings arrow -->
  <text x="300" y="85" text-anchor="middle" fill="#3fb950" font-size="10">2.2× less RAM →</text>

  <!-- Y labels -->
  <text x="72" y="105" text-anchor="end" fill="#8b949e" font-size="9">0 GB</text>
  <text x="72" y="200" text-anchor="end" fill="#8b949e" font-size="9">1 GB</text>
  <text x="72" y="295" text-anchor="end" fill="#8b949e" font-size="9">2 GB</text>
</svg>
